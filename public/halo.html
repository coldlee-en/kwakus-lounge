<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OpenHaloCE · Kwaku's Lounge</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#edf3fc;font:14px system-ui}header{display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:60px}a,button{color:inherit;background:#222d3d;border:1px solid #35475e;border-radius:9px;padding:11px 14px;text-decoration:none;font:inherit;cursor:pointer}header strong{flex:1}#stage{height:calc(100dvh - 110px);position:relative}iframe{height:100%;width:100%;border:0;display:block}#status{font-size:12px;padding:8px 18px;margin:0;color:#a3b2c7}#exit{display:none;position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:2}.expanded{overflow:hidden}.expanded #stage{position:fixed;inset:0;z-index:10;height:100dvh}.expanded #exit,#stage:fullscreen #exit{display:block}#stage:fullscreen{height:100%;width:100%}@media(max-width:500px){header{padding:8px;font-size:12px;gap:7px}}</style></head><body><header><a href="/">← Kwaku's Lounge</a><strong>OpenHaloCE</strong><button id="expand">⛶ Fullscreen</button></header><div id="stage"><button id="exit">× Exit fullscreen</button></div><p id="status" role="status"></p><script>
const stage=document.querySelector('#stage'),status=document.querySelector('#status');
if(!crossOriginIsolated){status.textContent='Halo requires an HTTPS deployment with COOP/COEP headers. This preview cannot enable them.';}else{status.textContent='Use OpenHaloCE’s ownership confirmation and local game-data importer. Progress is managed by the hosted game.';const frame=document.createElement('iframe');frame.src='https://openhaloce.com/';frame.title='Original OpenHaloCE player';frame.allow='cross-origin-isolated; autoplay; fullscreen; gamepad; pointer-lock';frame.allowFullscreen=true;stage.prepend(frame);}
document.querySelector('#expand').onclick=async()=>{const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(!ios&&stage.requestFullscreen){try{await stage.requestFullscreen();return;}catch{}}document.body.classList.add('expanded');};document.querySelector('#exit').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();document.body.classList.remove('expanded');};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('expanded');});
</script></body></html>
